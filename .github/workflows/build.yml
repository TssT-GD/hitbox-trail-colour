name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          sdk: given
          target: Win64

      - uses: actions/upload-artifact@v4
        with:
          name: HitboxTrailInputColors
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
